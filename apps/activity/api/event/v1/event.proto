syntax = "proto3";

package api.event.v1;

option go_package = "admin/api/event/v1;v1";
option java_multiple_files = true;
option java_package = "api.event.v1";

service Event {
  rpc CreateEvent (CreateEventRequest) returns (CreateEventReply);
  rpc UpdateEvent (UpdateEventRequest) returns (UpdateEventReply);
  rpc DeleteEvent (DeleteEventRequest) returns (DeleteEventReply);
  rpc GetEvent (GetEventRequest) returns (GetEventReply);
  rpc ListEvent (ListEventRequest) returns (ListEventReply);
  rpc UpdateStatusEvent(UpdateStatusRequest) returns (UpdateStatusReply);
  rpc GetEventStock (GetEventStockRequest) returns (GetEventStockReply);
}

message CreateEventRequest {
  string title       = 1;
  string description = 2;
  string location    = 3;
  string cover_image = 4;
  string start_time  = 5;
  string end_time    = 6;

}

message CreateEventReply {
  int64  id         = 1;
  string title      = 2;
  string location   = 3;
  string start_time = 4;
  string end_time   = 5;
  string status     = 6;
  int32  sold_count = 7;
}

message UpdateEventRequest {
  string title       = 1;
  string description = 2;
  string location    = 3;
  string cover_image = 4;
  string start_time  = 5;
  string end_time    = 6;
}

message UpdateEventReply {
  string title       = 1;
  string description = 2;
  string location    = 3;
  string cover_image = 4;
  string start_time  = 5;
  string end_time    = 6;
  int32  sold_count  = 7;
}

message DeleteEventRequest {
  int64 id = 1;
}

message DeleteEventReply {}

message GetEventRequest {
  int64 id = 1;
}

message GetEventReply {
  string title       = 1;
  string description = 2;
  string location    = 3;
  string cover_image = 4;
  string start_time  = 5;
  string end_time    = 6;
  int32  sold_count  = 7;
  string status = 8;
}

message EventData {
  int64  id          = 1;
  string title       = 2;
  string description = 3;
  string location    = 4;
  string cover_image = 5;
  string start_time  = 6;
  string end_time    = 7;
  string status      = 8;
  int32  sold_count  = 9;
}

message ListEventRequest {
  int64 page = 1;
  int64 size = 2;
}

message ListEventReply {
  repeated EventData list  = 1;
  int64              total = 2;
}

message UpdateStatusRequest {
  int64  id     = 1;
  string status = 2;
}

message UpdateStatusReply {

}

message GetEventStockRequest {
  int64 id = 1;
}

message TicketTypeStock {
  int64 ticket_type_id = 1;
  int32 stock          = 2;
}

message GetEventStockReply {
  repeated TicketTypeStock stocks = 1;
}
