syntax = "proto3";

package api.transfer.v1;

option go_package = "admin/api/transfer/v1;v1";
option java_multiple_files = true;
option java_package = "api.transfer.v1";

service Transfer {
	rpc CreateTransfer (CreateTransferRequest) returns (CreateTransferReply);
	rpc UpdateTransfer (UpdateTransferRequest) returns (UpdateTransferReply);
	rpc DeleteTransfer (DeleteTransferRequest) returns (DeleteTransferReply);
	rpc GetTransfer (GetTransferRequest) returns (GetTransferReply);
	rpc ListTransfer (ListTransferRequest) returns (ListTransferReply);
}

// CREATE TABLE IF NOT EXISTS ticket_transfers (
//     id SERIAL PRIMARY KEY,
//     created_at TIMESTAMP WITH TIME ZONE,
//     updated_at TIMESTAMP WITH TIME ZONE,
//     deleted_at TIMESTAMP WITH TIME ZONE,
//     ticket_id INTEGER NOT NULL,
//     from_user_id INTEGER NOT NULL,
//     to_user_id INTEGER NOT NULL,
//     status VARCHAR(50) NOT NULL DEFAULT 'pending',
//     transfer_type VARCHAR(50) NOT NULL DEFAULT 'gift',
//     price DECIMAL(10,2),
//     reason TEXT,
//     reviewed_by INTEGER,
//     reviewed_at TIMESTAMP WITH TIME ZONE
// );

message CreateTransferRequest {
	int64 ticket_id = 1;
	int64 from_user_id = 2;
	int64 to_user_id = 3;
	string transfer_type = 4;
	float price = 5;
	string reason = 6;
}
message CreateTransferReply {
	int64 id = 1;
	int64 ticket_id = 2;
	int64 from_user_id = 3;
	int64 to_user_id = 4;
	string status = 5;
	string transfer_type = 6;
	float price = 7;
	string reason = 8;
}

message UpdateTransferRequest {
	int64 id = 1;
	int64 ticket_id = 2;
	int64 from_user_id = 3;
	int64 to_user_id = 4;
	optional string status = 5;
	string transfer_type = 6;
	float price = 7;
	string reason = 8;
	optional int64 reviewed_by = 9;
	optional string reviewed_at = 10;
}
message UpdateTransferReply {
	int64 id = 1;
	int64 ticket_id = 2;
	int64 from_user_id = 3;
	int64 to_user_id = 4;
	optional string status = 5;
	string transfer_type = 6;
	float price = 7;
	string reason = 8;
	optional int64 reviewed_by = 9;
	optional string reviewed_at = 10;
}

message DeleteTransferRequest {
	int64 id = 1;
}
message DeleteTransferReply {}

message GetTransferRequest {
	int64 id = 1;
}
message GetTransferReply {
	int64 id = 1;
	int64 ticket_id = 2;
	int64 from_user_id = 3;
	int64 to_user_id = 4;
	string status = 5;
	string transfer_type = 6;
	float price = 7;
	string reason = 8;
	optional int64 reviewed_by = 9;
	optional string reviewed_at = 10;
}
message TransferData {
	int64 id = 1;
	int64 ticket_id = 2;
	int64 from_user_id = 3;
	int64 to_user_id = 4;
	string status = 5;
	string transfer_type = 6;
	float price = 7;
	string reason = 8;
	optional int64 reviewed_by = 9;
	optional string reviewed_at = 10;
}
message ListTransferRequest {
	int64 page = 1;
	int64 size = 2;
	// 过滤维度：按票 / 转出方 / 接收方 / 审核状态 / 转让类型下钻
	int64 ticket_id = 3;
	int64 from_user_id = 4;
	int64 to_user_id = 5;
	optional string status = 6;
	optional string transfer_type = 7;
}
message ListTransferReply {
	repeated TransferData list = 1;
	int64 total = 2;
}
